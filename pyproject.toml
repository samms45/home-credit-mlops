[project]
name = "mlflow-home-credit-scoring"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "imbalanced-learn>=0.14.2",
    "jupyter>=1.1.1",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.9",
    "mlflow>=2.10.0",
    "numpy>=2.4.6",
    "pandas>=2.0,<3",
    "pg8000>=1.31.5",
    "protobuf==3.20.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "shap>=0.51.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
# Indique a pytest de chercher les modules (app, src...) a la racine du projet
# Sans ca, "from app.main import app" echoue car pytest ne trouve pas le dossier app/
pythonpath = ["."]
